name: build

# Builds LumeOS for the Raspberry Pi Zero W, runs the host and emulator tests,
# and - when the Raspberry Pi boot firmware can be downloaded - publishes a
# bootable SD card image as a workflow artifact.
#
# What the artifacts mean:
#   lumeos-sd-image  build/lumeos-sd.img  flashable image (kernel + Raspberry Pi
#                                         boot firmware), UNVERIFIED ON REAL
#                                         HARDWARE - see docs/testing.md
#   lumeos-kernel    build/kernel.img     flat kernel image the Pi firmware
#                   build/lumeos.elf      linked ELF with symbols for debugging

on:
  push:
    branches: [main, 'arena/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    env:
      # CI is strict on purpose: the ISA gate must actually run (no silent
      # pass when capstone is missing) and QEMU must be present.
      CHECK_ISA_FLAGS: --require-attributes --require-capstone
      CHECK_ABI_FLAGS: --require-capstone
      LUME_FIRMWARE_DIR: .firmware

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0          # LUME_BUILD_COMMIT is embedded in the kernel

      - name: Install the ARM toolchain, QEMU and test dependencies
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
              gcc-arm-none-eabi binutils-arm-none-eabi \
              qemu-system-arm \
              python3-capstone \
              file
          if ! python3 -c 'import capstone' 2>/dev/null; then
            echo "python3-capstone unavailable, falling back to pip"
            python3 -m pip install --break-system-packages capstone
          fi

      - name: Report tool versions
        run: |
          set -x
          arm-none-eabi-gcc --version | head -1
          arm-none-eabi-ld --version | head -1
          python3 --version
          python3 -c 'import capstone; print("capstone", capstone.__version__)'
          qemu-system-arm --version | head -1

      - name: Build the kernel (build/kernel.img)
        run: |
          set -o pipefail
          if ! make -j"$(nproc)" kernel 2>&1 | tee build-kernel.log; then
            # Make the real error readable through the checks API as well as
            # the log viewer.
            python3 tools/ci_annotate.py build-kernel.log --title "make kernel"
            exit 1
          fi

      - name: Upload the build logs (only if something failed)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ci-logs
          path: |
            build-kernel.log
            userspace.log
            host-tests.log
            build-image.log
            qemu-test.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Show the kernel image layout
        run: |
          python3 tools/elf2bin.py build/lumeos.elf build/kernel-verify.img \
              --require-paddr 0x8000
          cmp build/kernel.img build/kernel-verify.img
          file build/kernel.img build/lumeos.elf
          arm-none-eabi-size build/lumeos.elf || true

      # userspace/init is built by `make kernel` as well (the kernel image
      # embeds it), but it is built and checked here on its own so that a
      # failure says which half broke.
      - name: Build the first user program (build/userspace/init.elf)
        run: |
          set -o pipefail
          # Everything goes through the log, including the inspection below:
          # the annotation that records this step should say what the image is,
          # not just that a command succeeded.
          if ! {
                make userspace
                file build/userspace/init.elf
                arm-none-eabi-readelf -h -l build/userspace/init.elf
                arm-none-eabi-size build/userspace/init.elf
              } 2>&1 | tee userspace.log; then
            python3 tools/ci_annotate.py userspace.log --title "make userspace"
            exit 1
          fi
          # Record what the kernel will load: the QEMU test asserts that the
          # program's own output appears, so its entry point, its segments and
          # its size belong in the run.
          python3 tools/ci_annotate.py userspace.log --notice \
              --title "userspace init image" --grep "init.elf|LOAD " --max-chars 1400

      - name: Host unit tests (printf, string library, build tools)
        run: |
          set -o pipefail
          if ! make test-host 2>&1 | tee host-tests.log; then
            python3 tools/ci_annotate.py host-tests.log --title "make test-host"
            exit 1
          fi

      - name: Fetch the Raspberry Pi boot firmware
        id: firmware
        continue-on-error: true
        run: sh tools/fetch-firmware.sh "$LUME_FIRMWARE_DIR"

      - name: Build the bootable SD card image
        id: image
        if: steps.firmware.outcome == 'success'
        run: |
          set -o pipefail
          if ! make image 2>&1 | tee build-image.log; then
            python3 tools/ci_annotate.py build-image.log --title "make image"
            exit 1
          fi
          ls -l build/lumeos-sd.img
          sha256sum build/lumeos-sd.img build/kernel.img

      - name: Verify the SD card image (MBR, FAT16, boot files, contents)
        if: steps.image.outcome == 'success'
        run: |
          python3 tools/verify_image.py --image build/lumeos-sd.img \
              --kernel build/kernel.img --firmware-dir "$LUME_FIRMWARE_DIR" \
              --annotation | tee verify-image.log

      - name: Upload the SD card image
        if: steps.image.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: lumeos-sd-image
          path: build/lumeos-sd.img
          if-no-files-found: error
          retention-days: 30

      - name: Upload the kernel images and the ELF
        uses: actions/upload-artifact@v7
        with:
          name: lumeos-kernel
          path: |
            build/kernel.img
            build/lumeos.elf
            build/userspace/init.elf
          if-no-files-found: error
          retention-days: 30

      # Emulator boot test.  This is a real gate: the kernel must reach all of
      # its boot markers, print the self-test summary with no failures, and
      # leave no panic or fault output behind in QEMU's bcm2835 model.  It
      # proves nothing about real hardware - see docs/testing.md - but a
      # regression that breaks the boot now fails the build instead of being
      # reported as a note.
      - name: QEMU boot test (emulated)
        run: |
          set -o pipefail
          if ! python3 tests/qemu/run_qemu_test.py \
              --image build/kernel.img --elf build/lumeos.elf \
              --timeout 60 --required --machine raspi0 2>&1 | tee qemu-test.log; then
            # Explain the failure: which blocks ran, where it hung, what the
            # emulator refused to do.  Published as an annotation so it is
            # readable through the checks API.
            python3 tests/qemu/diagnose_boot.py \
                --image build/kernel.img --elf build/lumeos.elf \
                --timeout 10 2>&1 | tee qemu-diagnose.log || true
            python3 tools/ci_annotate.py qemu-diagnose.log \
                --title "qemu boot diagnosis" --error-lines 60 --max-chars 3500 \
                --lines 60
            # The kernel's own last words: the test log ends with the tail of
            # the serial console, which is where a fault dump or a panic
            # message appears.  Published with --tail so it is not filtered
            # through build-error patterns.
            python3 tools/ci_annotate.py qemu-test.log \
                --title "qemu boot test" --tail 30 --max-chars 3500
            # The userspace hand-off speaks in its own vocabulary, and when it
            # is what failed, these are the lines that say why.  Publishing them
            # separately keeps them out of the way of the tail above when it is
            # something else that broke.
            python3 tools/ci_annotate.py qemu-test.log \
                --title "userspace hand-off" --grep "init:|syscall:|elf:" \
                --max-chars 3000
            exit 1
          fi
          # Record the result of a passing boot too: "the emulator booted the
          # kernel" is the kind of claim that should be checkable afterwards
          # without reading a log whose download host may not be reachable.
          python3 tools/ci_annotate.py qemu-test.log \
              --title "QEMU boot test result" --notice \
              --grep "PASS via|FAILED |checks passed|guest error|NOTE:|earlier strategies" \
              --max-chars 2000

      - name: Summarise the build
        if: always()
        run: |
          {
            echo "## LumeOS build"
            echo
            echo "- commit: \`$(git rev-parse --short HEAD)\`"
            echo "- used zig cc: no (GNU arm-none-eabi-gcc as in docs/building.md)"
            if [ -f build/kernel.img ]; then
              echo "- kernel image: $(stat -c%s build/kernel.img) bytes"
            fi
            if [ -f build/lumeos-sd.img ]; then
              echo "- SD card image: $(stat -c%s build/lumeos-sd.img) bytes"
              echo "- sha256: \`$(sha256sum build/lumeos-sd.img | cut -d' ' -f1)\`"
              echo
              echo "**Flash this artifact to a microSD card and boot a Raspberry Pi"
              echo "Zero W; nothing in this repository has been validated on real"
              echo "hardware yet (docs/testing.md).**"
            else
              echo "- SD card image: **not built** (firmware download failed?)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
